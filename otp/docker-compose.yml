# Commute heatmap recompute worker. Previously ran its own OpenTripPlanner instance
# (Java, ~4GB heap) alongside it, but that competed for CPU/RAM with everything else on
# the VPS and made the whole host unresponsive during a recompute. Trip lookups now go
# through the public BVG API instead (src/lib/commute/bvg-planner.ts) — no local routing
# engine to host. If you still have the old commute-otp/commute-otp-build/commute-otp-download
# containers running from a previous deploy, stop and remove them; they're no longer used.
services:
  # Runs recompute jobs dispatched from the Vercel-hosted app (see
  # src/app/api/commute/recompute/route.ts). Needed because Vercel serverless functions
  # can't run a multi-hour job (pacing requests to the public BVG API makes a full grid
  # recompute slow by design — see COMMUTE_API_MIN_INTERVAL_MS below); this container has
  # no such time limit.
  commute-worker:
    build:
      context: ..
      dockerfile: otp/worker/Dockerfile
    container_name: commute-worker
    restart: unless-stopped
    ports:
      - "${COMMUTE_WORKER_PORT:-8096}:8091"
    environment:
      - NEXT_PUBLIC_APPWRITE_ENDPOINT=${NEXT_PUBLIC_APPWRITE_ENDPOINT}
      - NEXT_PUBLIC_APPWRITE_PROJECT_ID=${NEXT_PUBLIC_APPWRITE_PROJECT_ID}
      # Admin key — only used for the bulk delete-by-query that clears the map on a fresh
      # (non-resume) recompute (see src/lib/commute/admin.ts). Never sent to the browser.
      - APPWRITE_API_KEY=${APPWRITE_API_KEY}
      - BVG_API_BASE=${BVG_API_BASE:-https://v6.bvg.transport.rest}
      - COMMUTE_GRID_SPACING_METERS=${COMMUTE_GRID_SPACING_METERS:-500}
      - COMMUTE_WEBHOOK_SECRET=${COMMUTE_WEBHOOK_SECRET}
      # How many trip lookups the worker keeps in flight at once, all waiting on the
      # same rate gate below — this just bounds concurrency, it doesn't set the request rate.
      - COMMUTE_OTP_CONCURRENCY=${COMMUTE_OTP_CONCURRENCY:-2}
      # Minimum milliseconds between successive BVG API requests (shared across all
      # in-flight workers). v6.bvg.transport.rest documents no official rate limit, so this
      # is a conservative default (~2.5 req/s) rather than a known-safe number — raise it if
      # you still see 429s in the worker logs, lower it cautiously if it stays clean.
      - COMMUTE_API_MIN_INTERVAL_MS=${COMMUTE_API_MIN_INTERVAL_MS:-600}
